name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 Android SDK 37 组件
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-

      - name: 授予执行权限
        run: chmod +x gradlew

      - name: 运行单元测试（app+core+data+feature，不含 benchmark 模块）
        run: |
          ./gradlew \
            :core:core-model:testDebugUnitTest \
            :data:data-appops:testDebugUnitTest \
            :feature:feature-applist:testDebugUnitTest \
            :feature:feature-batch:testDebugUnitTest \
            :feature:feature-history:testDebugUnitTest \
            :feature:feature-settings:testDebugUnitTest

      # 正式签名从 GitHub Secrets 临时装配（keys 与密码不写入仓库/日志）。
      # 未配置 Secrets 时跳过，构建将回退 debug 签名（保证 CI 可跑）。
      - name: 装配 release 签名（GitHub Secrets）
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/ops-release.jks
          test -s app/ops-release.jks && echo "keystore decoded ok: $(wc -c < app/ops-release.jks) bytes" || echo "WARNING: keystore empty (校验下方细节)"
          printf 'storeFile=./ops-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > app/keystore.properties

      - name: 编译正式版 APK
        run: ./gradlew :app:assembleRelease
      - name: 标记签名状态（无 Secrets 时产物为 debug 签名，避免误用）
        run: |
          if [ -f app/keystore.properties ]; then
            echo "SIGN_SUFFIX=release" >> "$GITHUB_ENV"
          else
            echo "SIGN_SUFFIX=debug-signed" >> "$GITHUB_ENV"
            echo "WARNING: 未配置 Secrets，release 变体使用 debug 签名（仅限 CI 验证，不可分发）"
          fi
      - name: 生成依赖锁定（供漏洞扫描）
        continue-on-error: true
        run: ./gradlew :app:dependencies --write-locks -q || true
      - name: OSV 依赖漏洞扫描（报告不阻断）
        continue-on-error: true
        run: |
          curl -sL https://github.com/google/osv-scanner/releases/latest/download/osv-scanner-linux-amd64 -o /tmp/osv-scanner
          chmod +x /tmp/osv-scanner
          /tmp/osv-scanner -r . || true
      - name: 上传测试报告
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            app/build/test-results/testDebugUnitTest
            core/core-model/build/test-results/testDebugUnitTest
            data/data-appops/build/test-results/testDebugUnitTest
      - name: 上传 APK 安装包
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk-${{ env.SIGN_SUFFIX }}
          path: app/build/outputs/apk/release/*.apk

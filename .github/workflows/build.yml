name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 Android SDK 36 组件
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-

      - name: 授予执行权限
        run: chmod +x gradlew

      - name: 运行单元测试
        run: ./gradlew testDebugUnitTest

      - name: 编译正式版 APK
        run: ./gradlew assembleRelease

      - name: 上传测试报告
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            app/build/test-results/testDebugUnitTest
            core/core-model/build/test-results/testDebugUnitTest
            data/data-appops/build/test-results/testDebugUnitTest

      - name: 上传 APK 安装包
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk

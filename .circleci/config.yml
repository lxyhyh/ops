version: 2.1

jobs:
  build:
    docker:
      - image: cimg/android:2026.08
    steps:
      - checkout
      - restore_cache:
          keys:
            - gradle-cache-{{ checksum "gradle/libs.versions.toml" }}
      - run:
          name: 安装 Android SDK 36 组件
          command: |
            yes | sdkmanager --licenses > /dev/null 2>&1 || true
            sdkmanager "platforms;android-36" "build-tools;36.0.0" > /dev/null 2>&1 || true
      - run:
          name: 运行单元测试
          command: ./gradlew testDebugUnitTest --no-daemon
      - run:
          name: 编译调试版
          command: ./gradlew assembleDebug --no-daemon
      - save_cache:
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper
          key: gradle-cache-{{ checksum "gradle/libs.versions.toml" }}
      - store_test_results:
          path: app/build/test-results

workflows:
  build-and-test:
    jobs:
      - build
